<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="450" viewBox="0 0 1000 450" role="img" aria-labelledby="title desc"><title id="title">Luminark connection overview</title><desc id="desc">Your schedule: Time or Night Light. Luminark: Themes + brightness. Your displays: DDC/CI or laptop WMI</desc><rect width="1000" height="450" rx="20" fill="#f1e6d5"/><text x="48" y="62" fill="#865326" font-family="Segoe UI,Arial,sans-serif" font-size="18" font-weight="700">HOW LUMINARK CONNECTS</text><path d="M302 213h48m300 0h48" stroke="#865326" stroke-width="3"/><path d="m340 205 10 8-10 8m348-16 10 8-10 8" fill="none" stroke="#865326" stroke-width="3"/><rect x="48" y="130" width="252" height="160" rx="14" fill="#fff" stroke="#865326" stroke-opacity=".3"/><text x="174" y="185" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#202923">Your schedule</text><text x="174" y="230" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#526057">Time or Night Light</text><rect x="374" y="130" width="252" height="160" rx="14" fill="#fff" stroke="#865326" stroke-opacity=".3"/><text x="500" y="185" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#202923">Luminark</text><text x="500" y="230" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#526057">Themes + brightness</text><rect x="700" y="130" width="252" height="160" rx="14" fill="#fff" stroke="#865326" stroke-opacity=".3"/><text x="826" y="185" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="700" fill="#202923">Your displays</text><text x="826" y="230" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="13" fill="#526057">DDC/CI or laptop WMI</text><text x="48" y="367" font-family="Segoe UI,Arial,sans-serif" font-size="17" fill="#526057">External monitor controls require DDC/CI support. Laptop brightness uses WMI.</text></svg>