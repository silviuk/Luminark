name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag to build and attach assets to (e.g. v1.1.6)'
        required: false
        default: 'v1.1.6'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress

      - name: Restore dependencies
        run: dotnet restore -r win-x64

      - name: Publish Lumina (Framework-Dependent for Inno Setup)
        run: |
          dotnet publish -c Release -r win-x64 --self-contained false -o publish
          New-Item -ItemType Directory -Force -Path installer/publish
          Copy-Item -Recurse -Force publish/* installer/publish/

      - name: Compile Inno Setup Installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer/Luminark.iss

      - name: Publish Lumina (Self-Contained for MSIX / Windows Store)
        run: |
          dotnet publish -c Release -r win-x64 --self-contained true -o publish-selfcontained

      - name: Build MSIX Package
        shell: pwsh
        run: |
          $msixLayout = "msix-layout"
          New-Item -ItemType Directory -Force -Path $msixLayout
          Copy-Item -Recurse -Force publish-selfcontained/* $msixLayout/
          Copy-Item -Force installer/msix/AppxManifest.xml $msixLayout/AppxManifest.xml
          New-Item -ItemType Directory -Force -Path "$msixLayout/Assets"
          Copy-Item -Force installer/msix/Assets/* "$msixLayout/Assets/"
          Get-ChildItem "$msixLayout/Assets"

          $sdkBin = Split-Path (Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\makeappx.exe" | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          $makeappx = Join-Path $sdkBin "makeappx.exe"
          $makepri = Join-Path $sdkBin "makepri.exe"
          Write-Host "Using makeappx: $makeappx"
          Write-Host "Using makepri:  $makepri"

          # Compile package resource index (PRI) so Windows shell maps unplated icon variants without accent backplates
          & $makepri createconfig /cf "$msixLayout/priconfig.xml" /dq en-US /pv 10.0.0 /o
          & $makepri new /pr $msixLayout /cf "$msixLayout/priconfig.xml" /of "$msixLayout/resources.pri" /o
          Remove-Item "$msixLayout/priconfig.xml" -Force -ErrorAction SilentlyContinue

          [xml]$manifest = Get-Content installer/msix/AppxManifest.xml
          $pkgVersion = $manifest.Package.Identity.Version
          Write-Host "Packaging MSIX version: $pkgVersion"

          $msixOut = "installer/Output/Luminark-$pkgVersion-x64.msix"
          & $makeappx pack /d $msixLayout /p $msixOut /nv

      - name: Extract Release Notes
        id: release_notes
        shell: pwsh
        run: |
          $tag = "${{ inputs.release_tag || github.ref_name }}"
          $version = $tag.TrimStart('v')
          $notes = ""

          if (Test-Path "CHANGELOG.md") {
            $cl = Get-Content "CHANGELOG.md" -Raw
            if ($cl -match "(?ms)##\s*\[?$([regex]::Escape($version))\]?.*?\r?\n(.*?)(?=\r?\n##|\Z)") {
              $notes = $matches[1].Trim()
              Write-Host "Found release notes for v$version in CHANGELOG.md"
            }
          }

          if (-not $notes) {
            $manifestLocale = "manifests/s/silviuk/Luminark/$version/silviuk.Luminark.locale.en-US.yaml"
            if (Test-Path $manifestLocale) {
              $content = Get-Content $manifestLocale -Raw
              if ($content -match "(?ms)ReleaseNotes:\s*\|-\r?\n(.*?)(?=\r?\n[a-zA-Z0-9_-]+:|\Z)") {
                $notes = $matches[1].Trim()
                Write-Host "Found release notes for v$version in $manifestLocale"
              }
            }
          }

          if ($notes) {
            Set-Content -Path "release_notes.md" -Value $notes -Encoding utf8
            "has_notes=true" >> $env:GITHUB_OUTPUT
          } else {
            "has_notes=false" >> $env:GITHUB_OUTPUT
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: Luminark ${{ inputs.release_tag || github.ref_name }}
          body_path: ${{ steps.release_notes.outputs.has_notes == 'true' && 'release_notes.md' || '' }}
          generate_release_notes: ${{ steps.release_notes.outputs.has_notes != 'true' }}
          files: |
            installer/Output/Luminark-Setup-*.exe
            installer/Output/Luminark-*.msix
          draft: false
          prerelease: false
