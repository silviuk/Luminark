name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag to build and attach assets to (e.g. v1.1.6)'
        required: false
        default: 'v1.1.6'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Verify release versions
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v([1-9][0-9]*)\.([0-9]+)\.([0-9]+)$') {
            throw 'An explicit stable version tag is required.'
          }
          $expected = $env:RELEASE_TAG.Substring(1)
          [xml]$project = Get-Content Luminark.csproj -Raw
          [xml]$manifest = Get-Content installer/msix/AppxManifest.xml -Raw
          if ($project.Project.PropertyGroup.Version -ne $expected -or
              $manifest.Package.Identity.Version -ne "$expected.0") {
            throw "Source versions must match release $env:RELEASE_TAG."
          }

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.402

      - name: Install Inno Setup
        run: |
          $tool = (Get-Content Tools/ReleaseTools.json -Raw | ConvertFrom-Json).innosetup
          $setup = Join-Path $env:RUNNER_TEMP 'innosetup.exe'
          Invoke-WebRequest $tool.url -OutFile $setup
          if ((Get-FileHash $setup -Algorithm SHA256).Hash -ine $tool.sha256) { throw 'Inno Setup SHA256 mismatch.' }
          $compiler = Join-Path $env:RUNNER_TEMP 'InnoSetup'
          $install = Start-Process -FilePath $setup -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER',"/DIR=$compiler") -WindowStyle Hidden -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw 'Inno Setup installation failed.' }
          "INNO_COMPILER=$compiler/ISCC.exe" >> $env:GITHUB_ENV

      - name: Import release signing certificate
        shell: pwsh
        env:
          CODESIGN_PFX_BASE64: ${{ secrets.CODESIGN_PFX_BASE64 }}
          CODESIGN_PFX_PASSWORD: ${{ secrets.CODESIGN_PFX_PASSWORD }}
        run: ./Tools/Import-SigningCertificate.ps1

      - name: Restore dependencies
        run: dotnet restore -r win-x64 --locked-mode

      - name: Test brightness event regression
        run: dotnet run --project Tests/BrightnessRegression -c Release

      - name: Verify publishing inputs
        shell: pwsh
        run: |
          ./Tools/Test-StorePublishing.ps1
          ./Tools/Test-ReleaseInputs.ps1
          ./Tools/Audit-Dependencies.ps1

      - name: Publish Lumina (Framework-Dependent for Inno Setup)
        run: |
          dotnet publish -c Release -r win-x64 --self-contained false -o publish
          ./Tools/Sign-Artifacts.ps1 -Path publish/Luminark.exe,publish/Luminark.dll -CertificateThumbprint $env:CODESIGN_THUMBPRINT
          New-Item -ItemType Directory -Force -Path installer/publish
          Copy-Item -Recurse -Force publish/* installer/publish/

      - name: Compile Inno Setup Installer
        run: |
          & $env:INNO_COMPILER installer/Luminark.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed.' }
          ./Tools/Sign-Artifacts.ps1 -Path (Get-ChildItem installer/Output/Luminark-Setup-*.exe).FullName -CertificateThumbprint $env:CODESIGN_THUMBPRINT

      - name: Publish Lumina (Self-Contained for MSIX / Windows Store)
        run: |
          dotnet publish -c Release -r win-x64 --self-contained true -o publish-selfcontained
          ./Tools/Sign-Artifacts.ps1 -Path publish-selfcontained/Luminark.exe,publish-selfcontained/Luminark.dll -CertificateThumbprint $env:CODESIGN_THUMBPRINT

      - name: Build MSIX Package
        shell: pwsh
        run: |
          $msixLayout = "msix-layout"
          New-Item -ItemType Directory -Force -Path $msixLayout
          Copy-Item -Recurse -Force publish-selfcontained/* $msixLayout/
          Copy-Item -Force installer/msix/AppxManifest.xml $msixLayout/AppxManifest.xml
          New-Item -ItemType Directory -Force -Path "$msixLayout/Assets"
          Copy-Item -Force installer/msix/Assets/* "$msixLayout/Assets/"
          Get-ChildItem "$msixLayout/Assets"

          $sdkBin = Split-Path (Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\makeappx.exe" | Sort-Object FullName -Descending | Select-Object -First 1).FullName
          $makeappx = Join-Path $sdkBin "makeappx.exe"
          $makepri = Join-Path $sdkBin "makepri.exe"
          Write-Host "Using makeappx: $makeappx"
          Write-Host "Using makepri:  $makepri"

          # Compile package resource index (PRI) so Windows shell maps unplated icon variants without accent backplates
          & $makepri createconfig /cf "$msixLayout/priconfig.xml" /dq en-US /pv 10.0.0 /o
          & $makepri new /pr $msixLayout /cf "$msixLayout/priconfig.xml" /of "$msixLayout/resources.pri" /o
          Remove-Item "$msixLayout/priconfig.xml" -Force -ErrorAction SilentlyContinue

          [xml]$manifest = Get-Content installer/msix/AppxManifest.xml
          $pkgVersion = $manifest.Package.Identity.Version
          Write-Host "Packaging MSIX version: $pkgVersion"

          $msixOut = "installer/Output/Luminark-$pkgVersion-x64.msix"
          & $makeappx pack /d $msixLayout /p $msixOut /nv

      - name: Extract Release Notes
        id: release_notes
        shell: pwsh
        run: |
          $tag = "${{ inputs.release_tag || github.ref_name }}"
          $version = $tag.TrimStart('v')
          $notes = ""

          if (Test-Path "CHANGELOG.md") {
            $cl = Get-Content "CHANGELOG.md" -Raw
            if ($cl -match "(?ms)##\s*\[?$([regex]::Escape($version))\]?.*?\r?\n(.*?)(?=\r?\n##|\Z)") {
              $notes = $matches[1].Trim()
              Write-Host "Found release notes for v$version in CHANGELOG.md"
            }
          }

          if (-not $notes) {
            $manifestLocale = "manifests/s/silviuk/Luminark/$version/silviuk.Luminark.locale.en-US.yaml"
            if (Test-Path $manifestLocale) {
              $content = Get-Content $manifestLocale -Raw
              if ($content -match "(?ms)ReleaseNotes:\s*\|-\r?\n(.*?)(?=\r?\n[a-zA-Z0-9_-]+:|\Z)") {
                $notes = $matches[1].Trim()
                Write-Host "Found release notes for v$version in $manifestLocale"
              }
            }
          }

          if ($notes) {
            Set-Content -Path "release_notes.md" -Value $notes -Encoding utf8
            "has_notes=true" >> $env:GITHUB_OUTPUT
          } else {
            "has_notes=false" >> $env:GITHUB_OUTPUT
          }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: Luminark ${{ inputs.release_tag || github.ref_name }}
          body_path: ${{ steps.release_notes.outputs.has_notes == 'true' && 'release_notes.md' || '' }}
          generate_release_notes: ${{ steps.release_notes.outputs.has_notes != 'true' }}
          files: |
            installer/Output/Luminark-Setup-*.exe
            installer/Output/Luminark-*.msix
          draft: false
          prerelease: false

      - name: Remove imported signing certificate
        if: always()
        shell: pwsh
        run: |
          if ($env:CODESIGN_THUMBPRINT) {
            Remove-Item -LiteralPath "Cert:\CurrentUser\My\$env:CODESIGN_THUMBPRINT" -Force -ErrorAction SilentlyContinue
          }
