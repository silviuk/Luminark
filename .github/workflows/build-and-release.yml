name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress

      - name: Restore dependencies
        run: dotnet restore

      - name: Publish Lumina
        run: |
          dotnet publish -c Release -o publish
          New-Item -ItemType Directory -Force -Path installer/publish
          Copy-Item -Recurse -Force publish/* installer/publish/

      - name: Compile Inno Setup Installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer/Luminark.iss

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: Luminark ${{ github.ref_name }}
          files: |
            installer/Output/Luminark-Setup-*.exe
          draft: false
          prerelease: false
          generate_release_notes: true
