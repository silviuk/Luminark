name: Publish to Microsoft Store and WinGet

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Exact release tag to publish (for example v1.1.19).'
        required: true
        default: ''
        type: string
      publish_winget:
        description: 'Publish update to WinGet (microsoft/winget-pkgs)'
        required: true
        default: false
        type: boolean
      publish_store:
        description: 'Publish update to Windows Store (Microsoft Partner Center)'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: luminark-publication
  cancel-in-progress: false

jobs:
  publish:
    name: Publish Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test Store publishing guards
        shell: pwsh
        run: ./Tools/Test-StorePublishing.ps1

      # -----------------------------------------------------------------------
      # Step 1: Resolve Release Info & Download Assets
      # -----------------------------------------------------------------------
      - name: Resolve Release Information and Assets
        id: release_info
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          Write-Host "Resolving GitHub Release details..."
          $ErrorActionPreference = 'Stop'
          . ./Tools/StorePublishing.ps1
          $tag = $env:RELEASE_TAG.Trim()
          if ($tag -notmatch '^v([1-9][0-9]*)\.([0-9]+)\.([0-9]+)$') {
            throw 'An explicit stable release tag such as v1.1.19 is required.'
          }
          $version = $tag.Substring(1)
          $releaseJson = gh release view $tag --json tagName,name,assets,body,isDraft,isPrerelease
          if ($LASTEXITCODE -ne 0) { throw "Cannot resolve release $tag." }
          $release = $releaseJson | ConvertFrom-Json
          if ($release.tagName -cne $tag -or $release.isDraft -or $release.isPrerelease) {
            throw 'Only the requested published stable release may be submitted.'
          }
          git fetch --depth 1 origin "refs/tags/${tag}:refs/tags/${tag}"
          if ($LASTEXITCODE -ne 0) { throw "Cannot fetch release source $tag." }

          Write-Host "Target Release Tag: $tag (Version: $version)"
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT

          # Read notes from the selected release source, never the workflow's main checkout.
          $releaseNotes = (git show "${tag}:RELEASE_NOTES.md") -join "`n"
          if ($LASTEXITCODE -ne 0 -or $releaseNotes -notmatch "(?m)^What's New in Luminark v$([regex]::Escape($version)):") {
            throw "Release notes are missing or do not identify $tag."
          }
          $releaseNotes = $releaseNotes.Trim()

          # Store API releaseNotes character limit is 1500 chars
          if ($releaseNotes.Length -gt 1500) {
            Write-Host "Truncating release notes from $($releaseNotes.Length) to 1500 characters for Store limit."
            $releaseNotes = $releaseNotes.Substring(0, 1496) + "..."
          }

          Set-Content -Path "release_notes.txt" -Value $releaseNotes -Encoding utf8

          # Create directory and download all release artifacts
          New-Item -ItemType Directory -Path "release-assets" -Force | Out-Null
          gh release download $tag --dir release-assets
          if ($LASTEXITCODE -ne 0) { throw "Release assets are not ready for $tag." }

          $exeAsset = Get-Item "release-assets/Luminark-Setup-$tag.exe" -ErrorAction SilentlyContinue
          $msixAsset = Get-Item "release-assets/Luminark-$version.0-x64.msix" -ErrorAction SilentlyContinue
          if (-not $exeAsset -or -not $msixAsset) { throw "Expected versioned assets are missing from $tag." }
          foreach ($asset in @($exeAsset, $msixAsset)) {
            $remote = @($release.assets | Where-Object { $_.name -ceq $asset.Name })
            $actual = 'sha256:' + (Get-FileHash -LiteralPath $asset.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($remote.Count -ne 1 -or $remote[0].digest -ne $actual) {
              throw "Release asset SHA256 mismatch or missing digest: $($asset.Name)"
            }
            Write-Host "Verified SHA256 for $($asset.Name): $actual"
          }
          $identity = Get-LuminarkPackageIdentity -Path $msixAsset.FullName -Version $version
          Write-Host "Verified MSIX identity: $($identity.Name) $($identity.Version) $($identity.ProcessorArchitecture)"

          if ($exeAsset) {
            Write-Host "Found Setup Executable: $($exeAsset.Name)"
            "exe_path=$($exeAsset.FullName)" >> $env:GITHUB_OUTPUT
            "exe_name=$($exeAsset.Name)" >> $env:GITHUB_OUTPUT
            $installerUrl = "https://github.com/${{ github.repository }}/releases/download/$tag/$($exeAsset.Name)"
            "installer_url=$installerUrl" >> $env:GITHUB_OUTPUT
          } else {
            Write-Warning "No .exe installer file found in release assets."
          }

          if ($msixAsset) {
            Write-Host "Found MSIX Package: $($msixAsset.Name)"
            "msix_path=$($msixAsset.FullName)" >> $env:GITHUB_OUTPUT
            "msix_name=$($msixAsset.Name)" >> $env:GITHUB_OUTPUT
          } else {
            Write-Warning "No .msix package file found in release assets."
          }

      # -----------------------------------------------------------------------
      # Step 2: Publish to Windows Package Manager (WinGet)
      # -----------------------------------------------------------------------
      - name: Publish to WinGet
        if: ${{ inputs.publish_winget }}
        id: winget
        shell: pwsh
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
          TAG: ${{ steps.release_info.outputs.tag }}
          VERSION: ${{ steps.release_info.outputs.version }}
          INSTALLER_URL: ${{ steps.release_info.outputs.installer_url }}
        run: |
          Write-Host "=========================================================="
          Write-Host "Starting WinGet Publication (Package: silviuk.Luminark)"
          Write-Host "=========================================================="

          if (-not $env:WINGET_TOKEN) {
            "winget_status=Failed (Missing WINGET_TOKEN secret)" >> $env:GITHUB_OUTPUT
            throw "WINGET_TOKEN is required when WinGet publication is requested."
          }

          if (-not $env:INSTALLER_URL) {
            Write-Error "Cannot publish to WinGet: No installer executable URL found in release assets."
            "winget_status=Failed (No installer URL)" >> $env:GITHUB_OUTPUT
            exit 1
          }

          Write-Host "Downloading Microsoft Windows Package Manager Manifest Creator (wingetcreate)..."
          $releaseTool = Get-Content Tools/ReleaseTools.json -Raw | ConvertFrom-Json
          $wcUrl = $releaseTool.wingetcreate.url
          Invoke-WebRequest -Uri $wcUrl -OutFile "wingetcreate.exe"
          if ((Get-FileHash wingetcreate.exe -Algorithm SHA256).Hash -ine $releaseTool.wingetcreate.sha256) { throw 'wingetcreate SHA256 verification failed.' }

          Write-Host "Submitting manifest update to microsoft/winget-pkgs..."
          Write-Host "Package ID: silviuk.Luminark"
          Write-Host "Version:    $env:VERSION"
          Write-Host "URL:        $env:INSTALLER_URL"

          try {
            $generated = Join-Path $env:RUNNER_TEMP 'winget-manifests'
            .\wingetcreate.exe update --token $env:WINGET_TOKEN --urls $env:INSTALLER_URL --version $env:VERSION --out $generated silviuk.Luminark
            if ($LASTEXITCODE -ne 0) { throw 'WinGet manifest generation failed.' }
            $installer = @(Get-ChildItem $generated -Recurse -Filter silviuk.Luminark.installer.yaml)
            if ($installer.Count -ne 1) { throw 'Expected one generated installer manifest.' }
            ./Tools/Set-WinGetRuntime.ps1 -InstallerManifest $installer[0].FullName -Version $env:VERSION
            .\wingetcreate.exe submit --token $env:WINGET_TOKEN --no-open --prtitle "New version: silviuk.Luminark version $env:VERSION" $installer[0].DirectoryName
            if ($LASTEXITCODE -eq 0) {
              Write-Host "Successfully submitted WinGet manifest update PR!"
              "winget_status=Submitted PR successfully via wingetcreate" >> $env:GITHUB_OUTPUT
            } else {
              Write-Warning "wingetcreate exited with code $LASTEXITCODE. If the initial package PR is still open/pending merge in microsoft/winget-pkgs, subsequent updates cannot be submitted until that initial PR is merged."
              throw "wingetcreate failed with exit code $LASTEXITCODE. Check the initial package PR status."
            }
          } catch {
            Write-Warning "Error during wingetcreate execution: $_"
            "winget_status=Failed" >> $env:GITHUB_OUTPUT
            throw
          }

      # -----------------------------------------------------------------------
      # Step 3: Publish to Windows Store (Microsoft Partner Center)
      # -----------------------------------------------------------------------
      - name: Publish to Microsoft Store
        if: ${{ !cancelled() && inputs.publish_store && steps.release_info.outcome == 'success' }}
        id: msstore
        shell: pwsh
        env:
          TENANT_ID: ${{ secrets.MS_STORE_TENANT_ID }}
          SELLER_ID: ${{ secrets.MS_STORE_SELLER_ID }}
          CLIENT_ID: ${{ secrets.MS_STORE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.MS_STORE_CLIENT_SECRET }}
          APP_ID: ${{ secrets.MS_STORE_APP_ID }}
          VERSION: ${{ steps.release_info.outputs.version }}
          MSIX_PATH: ${{ steps.release_info.outputs.msix_path }}
          EXE_PATH: ${{ steps.release_info.outputs.exe_path }}
        run: |
          Write-Host "=========================================================="
          Write-Host "Starting Microsoft Store Publication"
          Write-Host "=========================================================="

          $ErrorActionPreference = 'Stop'
          . ./Tools/StorePublishing.ps1
          $null = Get-LuminarkPackageIdentity -Path $env:MSIX_PATH -Version $env:VERSION

          $missingSecrets = @()
          if (-not $env:TENANT_ID) { $missingSecrets += "MS_STORE_TENANT_ID" }
          if (-not $env:SELLER_ID) { $missingSecrets += "MS_STORE_SELLER_ID" }
          if (-not $env:CLIENT_ID) { $missingSecrets += "MS_STORE_CLIENT_ID" }
          if (-not $env:CLIENT_SECRET) { $missingSecrets += "MS_STORE_CLIENT_SECRET" }
          if (-not $env:APP_ID) { $missingSecrets += "MS_STORE_APP_ID" }

          if ($missingSecrets.Count -gt 0) {
            $list = $missingSecrets -join ", "
            throw "Microsoft Store credentials are missing: $list"
          }

          Write-Host "Authenticating with Microsoft Partner Center (Entra ID)..."
          $tokenResp = Invoke-RestMethod -Method Post -Uri "https://login.microsoftonline.com/$env:TENANT_ID/oauth2/v2.0/token" -ContentType "application/x-www-form-urlencoded" -Body @{
            grant_type    = "client_credentials"
            client_id     = $env:CLIENT_ID
            client_secret = $env:CLIENT_SECRET
            scope         = "https://manage.devcenter.microsoft.com/.default"
          }

          $accessToken = $tokenResp.access_token
          if (-not $accessToken) {
            Write-Error "Failed to obtain access token from Azure Entra ID."
            "store_status=Auth Failed" >> $env:GITHUB_OUTPUT
            exit 1
          }

          $headers = @{
            "Authorization" = "Bearer $accessToken"
            "Content-Type"  = "application/json"
            "Accept"        = "application/json"
          }

          Write-Host "Retrieving Application details for Product ID: $env:APP_ID..."
          $appUri = "https://manage.devcenter.microsoft.com/v1.0/my/applications/$env:APP_ID"
          $appObj = Invoke-RestMethod -Method Get -Uri $appUri -Headers $headers

          # Reuse only editable submissions; a committed submission must match this release.
          $createSubUri = "$appUri/submissions"
          $subId = $null
          $subObj = $null
          if ($appObj.pendingApplicationSubmission.id) {
            $candidateSubId = $appObj.pendingApplicationSubmission.id
            $candidateUri = "$createSubUri/$candidateSubId"
            $statusObj = Invoke-RestMethod -Method Get -Uri "$candidateUri/status" -Headers $headers
            $candidate = Invoke-RestMethod -Method Get -Uri $candidateUri -Headers $headers
            Write-Host "Existing submission $candidateSubId status: $($statusObj.status), category: $($candidate.applicationCategory)"
            foreach ($pkg in $candidate.applicationPackages) {
              Write-Host "Existing package: $($pkg.fileName), version: $($pkg.version), status: $($pkg.fileStatus)"
            }
            $action = Get-LuminarkSubmissionAction -Status $statusObj.status
            if ($action -eq 'Verify') {
              Assert-LuminarkSubmission -Submission $candidate -Version $env:VERSION -AllowPendingUpload:($statusObj.status -eq 'CommitStarted')
              Write-Host "Verified existing submission for $env:VERSION; status: $($statusObj.status). Publication may still be pending."
              "store_status=Verified existing $env:VERSION submission $candidateSubId (Status: $($statusObj.status))" >> $env:GITHUB_OUTPUT
              exit 0
            }
            if ($action -eq 'Edit') {
              $subId = $candidateSubId
              $subUri = $candidateUri
              $subObj = $candidate
            }
          }

          if (-not $subId) {
            Write-Host "Creating new draft submission for Product ID: $env:APP_ID..."
            $newSub = Invoke-RestMethod -Method Post -Uri $createSubUri -Headers $headers
            $subId = $newSub.id
            Write-Host "Created new draft submission: $subId"
            $subUri = "https://manage.devcenter.microsoft.com/v1.0/my/applications/$env:APP_ID/submissions/$subId"
            $subObj = Invoke-RestMethod -Method Get -Uri $subUri -Headers $headers
          }

          $fileUploadUrl = $subObj.fileUploadUrl
          if (-not $fileUploadUrl) {
            Write-Error "No fileUploadUrl found in submission $subId"
            "store_status=Failed (No fileUploadUrl)" >> $env:GITHUB_OUTPUT
            exit 1
          }

          # Load dynamic release notes for Store What's New section
          $releaseNotes = ""
          if (Test-Path "release_notes.txt") {
            $releaseNotes = (Get-Content "release_notes.txt" -Raw).Trim()
          }

          if (-not $releaseNotes) { throw 'Verified release notes are missing.' }

          Write-Host "Submitting release notes to Windows Store What's New (Length: $($releaseNotes.Length) chars):"
          Write-Host $releaseNotes

          # Load full store description if provided in repository
          $fullDescription = ""
          if (Test-Path "STORE_DESCRIPTION.md") {
            $fullDescription = (Get-Content "STORE_DESCRIPTION.md" -Raw).Trim()
            Write-Host "Found full store description from STORE_DESCRIPTION.md (Length: $($fullDescription.Length) chars)."
          } elseif (Test-Path "store_description.txt") {
            $fullDescription = (Get-Content "store_description.txt" -Raw).Trim()
            Write-Host "Found full store description from store_description.txt (Length: $($fullDescription.Length) chars)."
          }

          if ($subObj.listings) {
            foreach ($lang in $subObj.listings.PSObject.Properties) {
              if ($lang.Value.baseListing) {
                $lang.Value.baseListing.releaseNotes = $releaseNotes
                if ($fullDescription) {
                  $lang.Value.baseListing.description = $fullDescription
                  Write-Host "Updated $($lang.Name).baseListing.description from repository file."
                }
                if ($lang.Value.baseListing.shortDescription -and $lang.Value.baseListing.shortDescription.Length -gt 500) {
                  Write-Host "Truncating $($lang.Name).baseListing.shortDescription from $($lang.Value.baseListing.shortDescription.Length) to <= 500 characters."
                  $lang.Value.baseListing.shortDescription = "Native Windows 11 display automation: dynamic Light/Dark theme switching, Night Light sync, and hardware multi-monitor brightness control via DDC/CI and WMI with quick flyout controls."
                }
              }
            }
          }

          Write-Host "Changing Store category from '$($subObj.applicationCategory)' to UtilitiesAndTools."
          $subObj.applicationCategory = 'UtilitiesAndTools'
          $subObj.targetPublishMode = 'Immediate'
          if ($subObj.packageDeliveryOptions.packageRollout) {
            $subObj.packageDeliveryOptions.packageRollout.isPackageRollout = $false
          }
          $privacyUrl = 'https://github.com/silviuk/Luminark/blob/main/PRIVACY.md'
          Write-Host "Current product privacy policy: $privacyUrl (Partner Center Properties manages this URL; obsolete listing API field is ignored)."

          # Configure application packages
          $msixItem = Get-Item $env:MSIX_PATH
          $msixFileName = $msixItem.Name
          Write-Host "Configuring application package: $msixFileName"

          $pkgList = @()
          if ($subObj.applicationPackages) {
            foreach ($existingPkg in $subObj.applicationPackages) {
              if ($existingPkg.fileStatus -ne "PendingUpload") {
                $existingPkg.fileStatus = "PendingDelete"
                $pkgList += $existingPkg
              }
            }
          }
          $pkgList += @{
            fileName = $msixFileName
            fileStatus = "PendingUpload"
          }
          $subObj.applicationPackages = $pkgList

          Write-Host "Updating submission metadata with package information and release notes..."
          $subJson = $subObj | ConvertTo-Json -Depth 20
          $updatedSub = Invoke-RestMethod -Method Put -Uri $subUri -Headers $headers -Body $subJson
          Write-Host "Submission metadata updated successfully! Status: $($updatedSub.status)"

          # Prepare zip bundle containing the MSIX package
          Write-Host "Packaging MSIX into upload zip bundle..."
          $tempUploadDir = Join-Path $env:RUNNER_TEMP "msstore_upload_$([guid]::NewGuid().ToString('N'))"
          $bundleDir = Join-Path $tempUploadDir "bundle"
          New-Item -ItemType Directory -Path $bundleDir -Force | Out-Null
          Copy-Item -Path $msixItem.FullName -Destination (Join-Path $bundleDir $msixFileName)

          $zipPath = Join-Path $tempUploadDir "Upload.zip"
          Compress-Archive -Path "$bundleDir\*" -DestinationPath $zipPath

          Write-Host "Uploading package bundle to Azure Blob Storage ($([Math]::Round((Get-Item $zipPath).Length / 1MB, 2)) MB)..."
          $httpClient = [System.Net.Http.HttpClient]::new()
          $httpClient.Timeout = [System.TimeSpan]::FromMinutes(15)
          $fileStream = [System.IO.File]::OpenRead($zipPath)
          try {
            $streamContent = [System.Net.Http.StreamContent]::new($fileStream)
            $streamContent.Headers.ContentType = [System.Net.Http.Headers.MediaTypeHeaderValue]::Parse("application/zip")
            $request = [System.Net.Http.HttpRequestMessage]::new([System.Net.Http.HttpMethod]::Put, $fileUploadUrl)
            $request.Headers.Add("x-ms-blob-type", "BlockBlob")
            $request.Content = $streamContent
            $uploadResp = $httpClient.SendAsync($request).GetAwaiter().GetResult()
            if (-not $uploadResp.IsSuccessStatusCode) {
              $respErr = $uploadResp.Content.ReadAsStringAsync().GetAwaiter().GetResult()
              Write-Error "Azure Blob upload failed with status $($uploadResp.StatusCode): $respErr"
              "store_status=Upload to Azure Blob Failed" >> $env:GITHUB_OUTPUT
              exit 1
            }
            Write-Host "Successfully uploaded MSIX bundle to Azure Blob Storage!"
          } finally {
            $fileStream.Close()
            $fileStream.Dispose()
            $httpClient.Dispose()
          }

          Write-Host "Committing submission to Partner Center for certification..."
          $commitUri = "https://manage.devcenter.microsoft.com/v1.0/my/applications/$env:APP_ID/submissions/$subId/commit"
          $commitResp = Invoke-RestMethod -Method Post -Uri $commitUri -Headers $headers
          Write-Host "Submission $subId commit accepted: $($commitResp.status)"

          Write-Host "Polling submission status..."
          $statusUri = "https://manage.devcenter.microsoft.com/v1.0/my/applications/$env:APP_ID/submissions/$subId/status"
          $pollCount = 0
          $finalStatus = "CommitStarted"
          do {
            Start-Sleep -Seconds 10
            try {
              $statusObj = Invoke-RestMethod -Method Get -Uri $statusUri -Headers $headers
              $finalStatus = $statusObj.status
              Write-Host "Submission Status: $finalStatus"
              if ($finalStatus -ne "CommitStarted") { break }
            } catch {
              Write-Warning "Transient status polling error (submission is already committed): $_"
            }
            $pollCount++
          } while ($pollCount -lt 10)

          if ($finalStatus -in 'CommitFailed', 'PreProcessingFailed', 'CertificationFailed', 'ReleaseFailed', 'PublishFailed', 'Canceled') {
            throw "Submission $subId failed: $finalStatus. Details: $($statusObj.statusDetails | ConvertTo-Json -Depth 10 -Compress)"
          }
          $verifiedSub = Invoke-RestMethod -Method Get -Uri $subUri -Headers $headers
          Assert-LuminarkSubmission -Submission $verifiedSub -Version $env:VERSION -AllowPendingUpload:($finalStatus -eq 'CommitStarted')
          foreach ($pkg in $verifiedSub.applicationPackages) {
            Write-Host "Submitted package: $($pkg.fileName), version: $($pkg.version), status: $($pkg.fileStatus)"
          }
          Write-Host "Verified submission for $env:VERSION.0 x64, category UtilitiesAndTools, immediate publication."
          Write-Host "Submission $subId status: $finalStatus. Only Published means the update is live."
          "store_status=Verified $env:VERSION submission $subId (Status: $finalStatus; publication/certification may still be pending)" >> $env:GITHUB_OUTPUT

      # -----------------------------------------------------------------------
      # Step 4: Step Summary
      # -----------------------------------------------------------------------
      - name: Generate Workflow Summary
        if: always()
        shell: pwsh
        run: |
          $tag = "${{ steps.release_info.outputs.tag }}"
          $version = "${{ steps.release_info.outputs.version }}"
          $wingetStatus = "${{ steps.winget.outputs.winget_status }}"
          if (-not $wingetStatus) { $wingetStatus = "${{ steps.winget.outcome }}" }
          $storeStatus = "${{ steps.msstore.outputs.store_status }}"
          if (-not $storeStatus) { $storeStatus = "${{ steps.msstore.outcome }}" }

          $summary = @"
          ## 🚀 Publish to Store & WinGet Summary

          - **Target Release**: `$tag` (Version: `$version`)
          - **WinGet Target**: ``silviuk.Luminark``
          - **WinGet Status**: $wingetStatus
          - **Windows Store Status**: $storeStatus

          ---
          ### 🔑 Repository Secrets Reference
          To enable automated publication, configure the following secrets under **Settings > Secrets and variables > Actions**:

          | Secret Name | Purpose | How to obtain |
          |---|---|---|
          | ``WINGET_TOKEN`` | Submitting manifest PR to ``microsoft/winget-pkgs`` | GitHub Personal Access Token (PAT) with ``public_repo`` scope |
          | ``MS_STORE_TENANT_ID`` | Azure AD / Entra ID Tenant ID | Entra ID Overview or Partner Center |
          | ``MS_STORE_SELLER_ID`` | Partner Center Publisher / Seller ID | Partner Center Account Settings > Identifiers |
          | ``MS_STORE_CLIENT_ID`` | Entra ID App Registration Client ID | Azure Entra ID App Registrations |
          | ``MS_STORE_CLIENT_SECRET`` | Entra ID App Registration Client Secret | Azure Entra ID App Registrations > Certificates & secrets |
          | ``MS_STORE_APP_ID`` | Microsoft Store Product ID | Partner Center Product Overview (e.g. 9NCJG5RVRR1C) |
          "@

          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
