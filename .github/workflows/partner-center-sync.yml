name: Partner Center Sync

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: windows-latest
    steps:
      - name: Authenticate and Inspect Applications
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.WINGET_TOKEN }}
          TENANT_ID: ${{ secrets.MS_STORE_TENANT_ID }}
          SELLER_ID: ${{ secrets.MS_STORE_SELLER_ID }}
          CLIENT_ID: ${{ secrets.MS_STORE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.MS_STORE_CLIENT_SECRET }}
        run: |
          Write-Host "Authenticating with Microsoft Partner Center..."
          $tokenResp = Invoke-RestMethod -Method Post -Uri "https://login.microsoftonline.com/$env:TENANT_ID/oauth2/v2.0/token" -ContentType "application/x-www-form-urlencoded" -Body @{
            grant_type    = "client_credentials"
            client_id     = $env:CLIENT_ID
            client_secret = $env:CLIENT_SECRET
            scope         = "https://manage.devcenter.microsoft.com/.default"
          }

          $accessToken = $tokenResp.access_token
          if (-not $accessToken) {
            Write-Error "Failed to obtain access token."
            exit 1
          }

          $headers = @{
            "Authorization" = "Bearer $accessToken"
            "Content-Type"  = "application/json"
            "Accept"        = "application/json"
          }

          Write-Host "Listing Partner Center applications..."
          $appUri = "https://manage.devcenter.microsoft.com/v1.0/my/applications"
          $resp = Invoke-RestMethod -Method Get -Uri $appUri -Headers $headers
          $apps = $resp.value

          $appRows = @()
          $lunifierId = $null

          foreach ($app in $apps) {
            $name = $app.primaryName
            $id = $app.id
            $pkgFamily = $app.packageFamilyName
            Write-Host "Found App: $name (ID: $id, Package: $pkgFamily)"
            $appRows += "| $name | $id | $pkgFamily |"
            if ($name -like "*Lunifier*") {
              $lunifierId = $id
            }
          }

          $summary = @"
          ## Partner Center Applications
          | Name | Product ID | Package Family Name |
          |---|---|---|
          $($appRows -join "`n")

          "@
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

          Write-Host "Checking WINGET_TOKEN permissions..."
          gh auth status

          Write-Host "Syncing secrets to silviuk/Lunifier..."
          gh secret set MS_STORE_TENANT_ID --body "$env:TENANT_ID" --repo silviuk/Lunifier
          gh secret set MS_STORE_SELLER_ID --body "$env:SELLER_ID" --repo silviuk/Lunifier
          gh secret set MS_STORE_CLIENT_ID --body "$env:CLIENT_ID" --repo silviuk/Lunifier
          gh secret set MS_STORE_CLIENT_SECRET --body "$env:CLIENT_SECRET" --repo silviuk/Lunifier

          if ($lunifierId) {
            Write-Host "Setting MS_STORE_APP_ID for Lunifier: $lunifierId"
            gh secret set MS_STORE_APP_ID --body "$lunifierId" --repo silviuk/Lunifier
          } else {
            Write-Host "Lunifier not yet found in Partner Center applications."
          }

          Write-Host "Sync completed successfully."
