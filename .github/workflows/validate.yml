name: Validate
on:
  pull_request:
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          global-json-file: global.json
      - name: Restore locked dependencies
        run: dotnet restore Tests/BrightnessRegression --locked-mode
      - name: Build and test reliability
        run: dotnet run --project Tests/BrightnessRegression -c Release --no-restore
      - name: Test release safeguards
        shell: pwsh
        run: |
          ./Tools/Test-StorePublishing.ps1
          ./Tools/Test-ReleaseInputs.ps1
      - name: Audit dependencies
        shell: pwsh
        run: ./Tools/Audit-Dependencies.ps1
