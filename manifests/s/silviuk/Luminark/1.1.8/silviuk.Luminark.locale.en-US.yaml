ReleaseNotes: |-
  What's New in Luminark v1.1.8:
  - Prevent Unminimized Startup at Windows Boot: Resolved an issue where secondary or delayed startup triggers caused the main window to unexpectedly restore and pop up on screen at login.
  - Guarded Single-Instance Activation: Secondary launches with --minimized (or packaged StartupTask) now exit quietly and never activate the running background tray instance.
  - Autostart Consolidation & Cleanup: Standardized autostart strictly to the Windows Run registry key and added automatic cleanup routines for duplicate shortcuts in the Startup folder.
ReleaseNotesUrl: https://github.com/silviuk/Luminark/releases/tag/v1.1.8
