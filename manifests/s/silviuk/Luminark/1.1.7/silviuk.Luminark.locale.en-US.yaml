ReleaseNotes: |-
  What's New in Luminark v1.1.7:
  - Video Input Sources Customization: Manage, rename, and filter monitor inputs (HDMI, DP, USB-C) for the quick controls dropdown.
  - Active Signal Indicators: Green checkmarks next to inputs reporting active connected signals.
  - Inactive Monitor Retention: Retains displays switched to other devices/PCs so you can easily switch them back.
  - Configurable Hotkey: Press Win+J to instantly lock workstation and turn off displays while keeping the PC awake.
  - Positioning Fix: Multi-monitor and DPI-aware positioning guarantees the quick controls flyout is always fully visible.
