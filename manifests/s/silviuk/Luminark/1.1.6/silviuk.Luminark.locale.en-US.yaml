ReleaseNotes: |-
  What's New in Luminark v1.1.6:
  - Lock-Aware Sleep Prevention: Intelligently detects workstation lock/unlock events.
  - Monitors Off When Locked: Releases display keep-alive and pauses the mouse nudge pulse when locked (Win + L), allowing monitors to sleep and save power.
  - Continuous System Execution: Retains kernel Power Availability Requests so background jobs, downloads, and processes continue uninterrupted without sleeping or being suspended by Windows 11 Modern Standby (DAM).
  - Instant Restoration: Immediately restores display awake state and heartbeat pulse upon unlock.
