ReleaseNotes: |-
  What's New in Luminark v1.1.3:
  - Intelligent Night Shift & Dark Mode Synchronization: Fixed issue where schedule evaluation could switch Windows to Light Mode at night when Night Light was running on schedule.
  - Schedule-Aware Night Light Detection: Night Light state evaluation now accounts for scheduled time windows and sunset/sunrise, accurately reflecting Windows 11 Night Light active periods.
  - First-Launch Local Sun Discovery: On fresh installs, Luminark automatically initializes daylight hours using Windows location-based sunset and sunrise times.
  - Self-Contained Package: Fully self-contained .NET 8 x64 runtime embedded out-of-the-box with zero dependency prompts.
  - Resilient Sleep Prevention (Awake Engine): Periodic keep-awake heartbeat and power/session recovery hooks.
  - Display Hotplug Resiliency: Progressive detection for USB-C and external monitors.
ReleaseNotesUrl: https://github.com/silviuk/Luminark/releases/tag/v1.1.3
