ReleaseNotes: |-
  What's New in Luminark v1.1.4:
  - Kernel Power Availability Requests: Bulletproof sleep and display prevention supporting Windows 11 Modern Standby (S0 Low Power Idle).
  - Lightweight Framework-Dependent Installer: Standalone installer reduced to ~4 MB with automated, silent .NET 8 Desktop Runtime bootstrapping.
  - Native WinGet Runtime Dependency: Declared Microsoft.DotNet.DesktopRuntime.8 dependency for seamless WinGet installation.
  - Optimized Microsoft Store MSIX Package: Stripped unused satellite language assemblies and debug symbols.
  - Taskbar Accent Color Fix: Clean unplated taskbar icon assets without accent color background plate.
